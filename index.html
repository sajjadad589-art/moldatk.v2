<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta id="app-viewport" name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>مولدتك - إدارة المولدات بسهولة</title>
    <meta name="description" content="نظام إدارة المولدات الكهربائية والاشتراكات والجباية - مولدتك" />
    <meta name="theme-color" content="#0B1F3B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="مولدتك" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest?v=6" />
    <link rel="icon" href="/brand/moldatk-mark.svg?v=6" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/moldatk-apple-touch-v6.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script>
      (() => {
        const isStandalonePwa =
          window.matchMedia?.('(display-mode: standalone)').matches ||
          window.matchMedia?.('(display-mode: fullscreen)').matches ||
          window.navigator.standalone === true;

        if (!isStandalonePwa) return;

        const viewport = document.getElementById('app-viewport');
        viewport?.setAttribute(
          'content',
          'width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover'
        );

        const preventGestureZoom = event => event.preventDefault();
        document.addEventListener('gesturestart', preventGestureZoom, { passive: false });
        document.addEventListener('gesturechange', preventGestureZoom, { passive: false });
        document.addEventListener('gestureend', preventGestureZoom, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', event => {
          const now = Date.now();
          if (now - lastTouchEnd <= 300) event.preventDefault();
          lastTouchEnd = now;
        }, { passive: false });
      })();
    </script>
    <script src="/pwa-recovery-v6.js"></script>
      <script defer src="/ios-install.js?v=1"></script>
  </head>
  <body class="bg-[#F7F9FC] dark:bg-[#081521] text-[#0B1F3B] dark:text-slate-100 font-['Cairo',sans-serif] antialiased selection:bg-[#F2B544] selection:text-[#0B1F3B] transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
