name: Flutter isolated SQL review
on:
  push:
    branches: ['flutter/m01-foundation']
    paths:
      - 'docs/flutter-staging/sql/**'
      - '.github/workflows/flutter-sql-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: moldatk_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture_admin -d moldatk_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: fixture_admin
      PGPASSWORD: fixture_only
      PGDATABASE: moldatk_fixture
    steps:
      - uses: actions/checkout@v4
      - name: Install fixture schema
        run: psql -X -v ON_ERROR_STOP=1 -f docs/flutter-staging/sql/subscriber_create_fixture.sql
      - name: Compile private SQL candidate
        run: psql -X -v ON_ERROR_STOP=1 -f docs/flutter-staging/sql/subscriber_create_v1.review.sql
      - name: Execute transaction regression checks
        run: psql -X -v ON_ERROR_STOP=1 -f docs/flutter-staging/sql/subscriber_create_regression.sql
      - name: Compile private profile edit candidate
        run: psql -X -v ON_ERROR_STOP=1 -f docs/flutter-staging/sql/subscriber_profile_v1.review.sql
      - name: Profile edit regression
        run: psql -X -v ON_ERROR_STOP=1 -f docs/flutter-staging/sql/subscriber_profile_regression.sql
      - name: Compile private line move candidate
        run: psql -X -v ON_ERROR_STOP=1 -f docs/flutter-staging/sql/subscriber_line_v1.review.sql
      - name: Line move regression
        run: psql -X -v ON_ERROR_STOP=1 -f docs/flutter-staging/sql/subscriber_line_regression.sql
      - name: Compile private payment candidate
        run: psql -X -v ON_ERROR_STOP=1 -f docs/flutter-staging/sql/payment_v1.review.sql
      - name: Payment regression
        run: psql -X -v ON_ERROR_STOP=1 -f docs/flutter-staging/sql/payment_regression.sql
      - name: Compile private payment reversal candidate
        run: psql -X -v ON_ERROR_STOP=1 -f docs/flutter-staging/sql/payment_reversal_v1.review.sql
      - name: Payment reversal regression
        run: psql -X -v ON_ERROR_STOP=1 -f docs/flutter-staging/sql/payment_reversal_regression.sql
      - name: Concurrent idempotency check
        run: bash docs/flutter-staging/sql/subscriber_create_concurrency.sh
