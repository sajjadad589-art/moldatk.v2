name: Payment Flow 1.3.20 Regression

on:
  push:
    branches: [fix-payment-flow-1.3.20-test]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'android/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/payment-flow-regression.yml'

permissions:
  contents: read

jobs:
  payment-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://adluynhkikoodjljoxeu.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_CObjK2Uua18kVkXCkxdRog_keQLIDiE
      VITE_ENABLE_NATIVE_PUSH: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run payment accounting regression
        run: npx tsx scripts/payment-receipt-flow-smoke-test.ts
      - name: Typecheck full mutated application
        run: npm run lint
      - name: Re-run payment accounting after mutation chain
        run: npx tsx scripts/payment-receipt-flow-smoke-test.ts
      - name: Verify user-visible payment fixes
        run: |
          grep -q 'getSubscriberOutstanding' src/components/PaymentMethodModal.tsx
          grep -q 'applySubscriberPayment' src/components/SubscriberModal.tsx
          grep -q 'applySubscriberPayment' src/components/POSQuickView.tsx
          grep -q 'المسدد سابقاً' src/components/InvoiceReceiptModal.tsx
          grep -q 'المتبقي قبل الدفعة' src/components/InvoiceReceiptModal.tsx
          grep -q 'المتبقي بعد الدفعة' src/components/InvoiceReceiptModal.tsx
          grep -q "useState<number | ''>('')" src/components/SubscriberModal.tsx
          grep -q 'inputMode="numeric"' src/components/SubscriberModal.tsx
          grep -q 'PAYMENT_COLLECTOR_NO_DESTRUCTIVE_RECONCILE' src/lib/useGeneratorCloudSync.ts
          grep -q 'PAYMENT_COLLECTOR_NO_INVOICE_RECONCILE' src/lib/useGeneratorCloudSync.ts
          grep -q 'if (refreshing.current || pushing.current) return;' src/lib/useGeneratorCloudSync.ts
          grep -q 'ignoreDuplicates: true' src/lib/useGeneratorCloudSync.ts
          grep -q 'moldatk-shell-v4-1.3.20' public/sw.js
          grep -q '/sw.js?v=1.3.20' src/main.tsx
      - name: Build web app
        run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
