name: Sync and cashbox regression
on:
  pull_request:
  push:
    branches: [main, fix/event-sync-cashbox-reset, fix/no-tariff-subscriber-state]
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://adluynhkikoodjljoxeu.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_CObjK2Uua18kVkXCkxdRog_keQLIDiE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - name: Subscription access regression
        run: npx tsx scripts/subscription-lock-regression.ts

      - name: Saved account biometric login regression
        run: node scripts/saved-account-passkey-login-regression.mjs

      - name: Subscriber QR portal regression
        run: npm run test:portal
      - run: node scripts/sync-conflict-resolution-regression.mjs
      - run: npm run test:sync-cashbox
      - run: node scripts/live-sync-receipt-cashbox-parity-regression.mjs
      - run: node scripts/financial-integrity-static-regression.mjs
      - run: npx tsx scripts/financial-integrity-runtime-test.ts
      - run: npm run build
      - run: npx tsc --noEmit
