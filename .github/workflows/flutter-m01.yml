name: Flutter M01 verification
on:
  push:
    branches:
      - 'flutter/m01-foundation'
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/flutter-m01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.38.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | flutter doctor --android-licenses
      - name: Inspect environment
        run: flutter doctor -v
      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            python3 tool/bootstrap_android.py
          fi
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=APP_ENV=development
      - uses: actions/upload-artifact@v4
        with:
          name: moldatk-flutter-m01-debug
          path: apps/flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
