name: Build Android APK / AAB

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'release = signed APK + AAB, debug = install test APK only'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - '.github/workflows/android-apk.yml'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_SUPABASE_URL: https://adluynhkikoodjljoxeu.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_CObjK2Uua18kVkXCkxdRog_keQLIDiE
      CURRENT_VERSION: 1.3.5
      CURRENT_VERSION_CODE: 9
      SHOULD_RELEASE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck launch build
        run: npm run lint

      - name: Accountant monthly regression test
        run: npx tsx scripts/monthly-ledger-smoke-test.ts

      - name: Accountant tariff deletion test
        run: npx tsx scripts/monthly-tariff-deletion-smoke-test.ts

      - name: Accountant full app audit
        run: npx tsx scripts/accountant-app-audit.ts

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare debug APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Moldatk-Android-Debug.apk

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moldatk-Android-Debug
          path: release/Moldatk-Android-Debug.apk
          retention-days: 14

      - name: Validate release signing secrets
        if: env.SHOULD_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MOLDATK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MOLDATK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOLDATK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOLDATK_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing MOLDATK_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing MOLDATK_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing MOLDATK_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing MOLDATK_KEY_PASSWORD" && exit 1)

      - name: Restore release signing key
        if: env.SHOULD_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MOLDATK_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/moldatk-release.keystore

      - name: Build signed release APK and AAB
        if: env.SHOULD_RELEASE == 'true'
        env:
          MOLDATK_SIGNING_STORE_FILE: ${{ github.workspace }}/android/app/moldatk-release.keystore
          MOLDATK_SIGNING_STORE_PASSWORD: ${{ secrets.MOLDATK_KEYSTORE_PASSWORD }}
          MOLDATK_SIGNING_KEY_ALIAS: ${{ secrets.MOLDATK_KEY_ALIAS }}
          MOLDATK_SIGNING_KEY_PASSWORD: ${{ secrets.MOLDATK_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Prepare signed release files
        if: env.SHOULD_RELEASE == 'true'
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/Moldatk-Android-Release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release/Moldatk-Android-Release.aab

      - name: Upload signed release artifacts
        if: env.SHOULD_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Moldatk-Android-Signed-Release
          path: |
            release/Moldatk-Android-Release.apk
            release/Moldatk-Android-Release.aab
          retention-days: 30

      - name: Publish approved GitHub release
        if: env.SHOULD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${CURRENT_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/Moldatk-Android-Release.apk release/Moldatk-Android-Release.aab --clobber
          else
            gh release create "$TAG" release/Moldatk-Android-Release.apk release/Moldatk-Android-Release.aab \
              --title "Moldatk ${CURRENT_VERSION}" \
              --notes "نسخة Android Release موقعة: APK للتثبيت المباشر و AAB للرفع على Google Play."
          fi

      - name: Activate in-app update manifest
        if: env.SHOULD_RELEASE == 'true'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = process.env.CURRENT_VERSION;
          const versionCode = Number(process.env.CURRENT_VERSION_CODE);
          const manifest = {
            enabled: true,
            versionCode,
            versionName: version,
            minimumVersionCode: 5,
            force: false,
            apkUrl: `https://github.com/sajjadad589-art/moldatk.v2/releases/download/v${version}/Moldatk-Android-Release.apk`,
            notes: 'تحديث الأشهر الرقمية، تفعيل التسعيرة الشهرية الفوري، ترحيل الديون، التقارير، وفحص محاسبي شامل.'
          };
          fs.writeFileSync('public/app-version.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-version.json
          if ! git diff --cached --quiet; then
            git commit -m "Activate in-app update ${CURRENT_VERSION}"
            git push
          fi
